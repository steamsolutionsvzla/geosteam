services:

  geoserver:
    image: docker.osgeo.org/geoserver:2.28.2
    container_name: geoserver
    restart: unless-stopped
    ports:
      # Expone la consola web de GeoServer directamente en el host, para
      # que el botón "Abrir GeoServer" del panel de administrador
      # (http://localhost:8080/geoserver/web/) funcione sin pasar por el
      # proxy JWT del backend (ese proxy es solo para las peticiones WFS
      # del mapa, no para la consola de administración humana).
      - "8080:8080"
    env_file:
      - .env
    environment:
      # NOTA: tras el primer arranque (una vez creado el usuario admin con
      # esta contraseña), se recomienda quitar estas dos variables del
      # servicio, porque si se dejan, GeoServer puede sobrescribir en cada
      # reinicio los usuarios/roles que se hayan creado después vía la consola.
      - GEOSERVER_ADMIN_USER=${GEOSERVER_ADMIN_USER}
      - GEOSERVER_ADMIN_PASSWORD=${GEOSERVER_ADMIN_PASSWORD}
      - POSTGRES_HOST=host.docker.internal
      - POSTGRES_PORT=5433
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USERNAME=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_JNDI_RESOURCE_NAME=jdbc/PostGISDB
      - POSTGRES_JNDI_ENABLED=true
    volumes:
      - ./geoserver_data:/opt/geoserver_data
    extra_hosts:
    - "host.docker.internal:host-gateway"

  backend:
    build: ./backend
    container_name: backend-geosteam
    restart: always
    ports:
      - "8001:8000"
    env_file:
      - .env
    environment:
      - DB_HOST=host.docker.internal
      # Estas variables se inyectan explícitamente al backend para que no haya ambigüedad:
      - SECRET_KEY=${SECRET_KEY}
      - ALGORITHM=${ALGORITHM}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES}
      - GEOSERVER_ADMIN_USER=${GEOSERVER_ADMIN_USER}
      - GEOSERVER_ADMIN_PASSWORD=${GEOSERVER_ADMIN_PASSWORD}
      - GEOSERVER_AUTH_HEADER=${GEOSERVER_AUTH_HEADER}
    extra_hosts:
      - "host.docker.internal:host-gateway"